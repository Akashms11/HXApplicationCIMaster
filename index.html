<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPS Dummy App | Dashboard</title>
    <style>
        :root { --primary: #2563eb; --dark: #1e293b; --light: #f8fafc; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--light); color: var(--dark); display: flex; justify-content: center; padding-top: 50px; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); width: 80%; max-width: 500px; text-align: center; }
        h1 { color: var(--primary); }
        .btn { background: var(--primary); color: white; padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 20px; transition: 0.3s; }
        .btn:hover { background: #1d4ed8; transform: scale(1.05); }
        #status { margin-top: 20px; font-weight: bold; color: #059669; }
    </style>
</head>
<body>

<div class="card">
    <h1>SPS Dummy App</h1>
    <p>This is a Java 17 Spring Boot application managed via GitHub Actions CI/CD.</p>

    <div id="status">System Status: Checking...</div>

    <button class="btn" onclick="sayHello()">Check System</button>
</div>

<script>
    function sayHello() {
        const status = document.getElementById('status');
        status.innerText = "System Status: Online & Healthy! ✅";
        status.style.color = "#059669";
    }
</script>
</body>
</html>
